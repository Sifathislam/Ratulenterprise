upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name ratulenterprise.com www.ratulenterprise.com;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare always terminates TLS with the visitor before reaching us,
        # even in Flexible mode where it then talks plain HTTP to this origin
        # ($scheme here would wrongly say "http"). Hardcode https so Django
        # correctly treats every request as secure.
        proxy_set_header X-Forwarded-Proto https;
    }
}
